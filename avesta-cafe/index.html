<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ئاڤێستا کافێ - Avesta Cafe</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background-color: #121212; color: #f5f5f5; margin: 0; padding-bottom: 70px; direction: rtl; text-align: right; }
        .hero { text-align: center; padding: 40px 20px; background: linear-gradient(rgba(18,18,18,0.85), rgba(18,18,18,0.95)), url('https://images.unsplash.com/photo-1495474472287-4d71bcdd2085') center/cover; border-bottom: 2px solid #d4af37; }
        .hero h1 { font-size: 2.5rem; color: #d4af37; margin: 5px 0; }
        .hero p { color: #d0c0b0; }
        .btn-gold { background-color: #d4af37; color: #121212; border: none; padding: 10px 25px; border-radius: 20px; font-weight: bold; cursor: pointer; font-family: 'Vazirmatn', sans-serif; margin-top: 15px; }
        .section-title { padding: 20px; color: #d4af37; }
        .categories { display: flex; gap: 10px; overflow-x: auto; padding: 0 20px; scrollbar-width: none; }
        .cat-btn { background: #1e1b18; color: #fff; border: 1px solid #332922; padding: 8px 18px; border-radius: 20px; cursor: pointer; white-space: nowrap; font-family: 'Vazirmatn', sans-serif; }
        .cat-btn.active { background: #d4af37; color: #121212; font-weight: bold; }
        .menu-list { padding: 20px; }
        .item-card { background-color: #1e1b18; border: 1px solid #332922; padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .item-card img { width: 70px; height: 70px; border-radius: 8px; object-fit: cover; margin-left: 15px; }
        .item-info { flex-grow: 1; }
        .item-info h3 { margin: 0 0 5px 0; color: #fff; }
        .item-info p { margin: 0 0 8px 0; font-size: 0.8rem; color: #aaa; }
        .price { color: #d4af37; font-weight: bold; }
        .add-btn { background-color: #d4af37; color: #121212; border: none; padding: 6px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; font-family: 'Vazirmatn', sans-serif; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #1a1714; border-top: 1px solid #332922; display: flex; justify-content: space-around; padding: 10px 0; z-index: 100; }
        .nav-item { color: #aaa; text-align: center; font-size: 0.75rem; cursor: pointer; background: none; border: none; font-family: 'Vazirmatn', sans-serif; }
        .nav-item.active { color: #d4af37; }
        .nav-item span { display: block; font-size: 1.2rem; }
        .modal { display: none; position: fixed; z-index: 200; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); }
        .modal-content { background-color: #1e1b18; margin: 20% auto; padding: 20px; border: 1px solid #d4af37; width: 85%; max-width: 400px; border-radius: 12px; text-align: center; color: #fff; }
        .close-btn { float: left; font-size: 24px; cursor: pointer; color: #d4af37; }
        .page { display: none; }
        .page.active { display: block; }
    </style>
</head>
<body>

    <div id="home-page" class="page active">
        <div class="hero">
            <h1>ئاڤێستا کافێ</h1>
            <p>قاوەی خۆش، کاتی خۆشتر ☕</p>
            <button class="btn-gold" onclick="switchPage('menu')">بینینی مینۆ</button>
        </div>
    </div>

    <div id="menu-page" class="page">
        <div class="section-title"><h2>مینۆی ئاڤێستا</h2></div>
        <div class="categories">
            <button class="cat-btn active" onclick="filterMenu('all')">هەمووی</button>
            <button class="cat-btn" onclick="filterMenu('coffee')">قاوە</button>
            <button class="cat-btn" onclick="filterMenu('cold')">ساردەمەنی</button>
            <button class="cat-btn" onclick="filterMenu('cake')">شیرینی</button>
        </div>
        <div class="menu-list" id="menu-items-container"></div>
    </div>

    <div id="about-page" class="page">
        <div class="section-title"><h2>دەربارەی ئاڤێستا</h2></div>
        <div style="padding: 20px; background: #1e1b18; margin: 20px; border-radius: 12px;">
            <p>هەر لە ئاڤێستا، هەوڵدەین باشترین قاوە و شیرینی پێشکەش بە ئارەزوومەندانی بکەین بە ژینگەیەکی ئارام و هێمن. 🤎✨</p>
            <p><strong>کاتژمێری کارکردن:</strong> 9:00 بەیانی - 11:00 شەو</p>
            <p><strong>شوێن:</strong> هەولێر</p>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchPage('home')"><span>🏠</span>سەرەکی</button>
        <button class="nav-item" onclick="switchPage('about')"><span>⭐</span>دەربارە</button>
        <button class="nav-item" onclick="switchPage('menu')"><span>📜</span>مینۆ</button>
        <button class="nav-item" onclick="openCart()"><span>🛒</span>سەبەتە (<span id="cart-count">0</span>)</button>
    </nav>

    <div id="cart-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeCart()">&times;</span>
            <h2>سەبەتەکەت 🛍️️</h2>
            <div id="cart-items-list" style="margin: 15px 0;">سەبەتەکەت خالییە</div>
            <h3>کۆی گشتی: <span id="total-price">0</span> د.ع</h3>
            <button class="btn-gold" style="width: 100%;" onclick="sendOrder()">داواکردن</button>
        </div>
    </div>

    <script>
        const menuData = [
            { name: 'ئێسپرێسۆ', cat: 'coffee', price: 2500, desc: 'قاوەیەکی بەهێز و خۆش', img: 'https://images.unsplash.com/photo-1510591509098-f4fdc6d0ff04' },
            { name: 'کاپوچینۆ', cat: 'coffee', price: 4000, desc: 'قاوەی نەرم لەگەل فۆمی شیر ', img: 'https://images.unsplash.com/photo-1572442388796-11668a67e53d' },
            { name: 'مۆکا', cat: 'coffee', price: 4500, desc: 'قاوە تێکەڵ بە چۆکۆلاتە و شیر', img: 'https://images.unsplash.com/photo-1541167760496-1628856ab772' },
            { name: 'لاتە', cat: 'coffee', price: 4000, desc: 'شیر و ئەسپرێسۆ بە کەفێکی نەرم', img: 'https://images.unsplash.com/photo-1534778101976-62847782c213' },
            { name: 'ئیسپرێسۆ دۆپیۆ', cat: 'coffee', price: 3000, desc: 'دوو قاتی ئێسپرێسۆی توند', img: 'https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd' },


{ name: 'ئایس لاتێ', cat: 'cold', price: 4500, desc: 'قاوەی سارد لەگەڵ شیر', img: 'https://i.postimg.cc/zXjp7JWW/IMG-1040.jpg' },
{ name: 'ئایس کۆفی', cat: 'cold', price: 4000, desc: 'قاوەی ساردکراوەی تایبەت', img: 'https://i.postimg.cc/7LTgFDCS/IMG-1039.jpg' },

            { name: 'کێکی چۆکۆلاتە', cat: 'cake', price: 5000, desc: 'کێکی نەرم و دڵفڕێن بە چۆکۆلاتە', img: 'https://images.unsplash.com/photo-1606313564200-e75d5e30476c' },
            { name: 'چیزکێک', cat: 'cake', price: 6000, desc: 'چیزکێک بە مێوژ و سۆسی شلیلک', img: 'https://images.unsplash.com/photo-1533134242443-d4fd215305ad' },
            { name: 'کێکی هەنگوین', cat: 'cake', price: 5500, desc: 'کێکی نەریتی بەتام بە هەنگوین', img: 'https://images.unsplash.com/photo-1578985545062-69928b1d9587' },
            { name: 'کڕۆسۆنی فەرەنسی', cat: 'cake', price: 3000, desc: 'کڕۆسۆنی گەرم و پڕ لە قەیماغ یان پەنیر', img: 'https://images.unsplash.com/photo-1555507036-ab1f4038808a' }
        ];

        let cart = [];

        function renderMenu(category = 'all') {
            const container = document.getElementById('menu-items-container');
            container.innerHTML = '';
            let filtered = category === 'all' ? menuData : menuData.filter(i => i.cat === category);
            
            filtered.forEach(item => {
                container.innerHTML += `
                    <div class="item-card">
                        <img src="${item.img}" alt="${item.name}">
                        <div class="item-info">
                            <h3>${item.name}</h3>
                            <p>${item.desc}</p>
                            <span class="price">${item.price.toLocaleString()} د.ع</span>
                        </div>
                        <button class="add-btn" onclick="addToCart('${item.name}', ${item.price})">+ زیادکردن</button>
                    </div>
                `;
            });
        }

        function filterMenu(cat) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            renderMenu(cat);
        }

        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId + '-page').classList.add('active');
            if(pageId === 'menu') renderMenu('all');
        }

        function addToCart(name, price) {
            cart.push({ name, price });
            document.getElementById('cart-count').innerText = cart.length;
            alert("زیادکرا بۆ سەبەتە! 🛒");
        }

        function openCart() {
            let list = document.getElementById('cart-items-list');
            let total = 0;
            if (cart.length === 0) {
                list.innerHTML = "سەبەتەکەت خالییە";
            } else {
                list.innerHTML = "";
                cart.forEach(item => {
                    total += item.price;
                    list.innerHTML += `<p>${item.name} - ${item.price.toLocaleString()} د.ع</p>`;
                });
            }
            document.getElementById('total-price').innerText = total.toLocaleString();
            document.getElementById('cart-modal').style.display = 'block';
        }

        function closeCart() { document.getElementById('cart-modal').style.display = 'none'; }

        function sendOrder() {
            if(cart.length === 0) { alert("سەبەتەکەت خالییە!"); return; }
            let allOrders = JSON.parse(localStorage.getItem('cafeOrders')) || [];
            allOrders.push({ items: cart, time: new Date().toLocaleTimeString() });
            localStorage.setItem('cafeOrders', JSON.stringify(allOrders));
            alert("داواکارییەکەت سەرکەوتووانە نێردرا! سوپاس ☕");
            cart = [];
            document.getElementById('cart-count').innerText = 0;
            closeCart();
        }

        renderMenu();
    </script>
</body>
</html>
